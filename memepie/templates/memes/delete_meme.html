{% extends 'base.html' %}

{% block title %}Delete Meme - MemePie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="auth-card">
            <div class="auth-header text-center text-danger">
                <h2>Delete Post?</h2>
            </div>
            <div class="text-center">
                <p>Are you sure you want to delete this post? This action cannot be undone.</p>
                <div class="post-image-container mb-3">
                    <img src="{{ meme.image.url }}" class="img-fluid rounded" alt="{{ meme.caption }}" style="max-height: 200px; object-fit: cover;">
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 8px;">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 py-2" style="border-radius: 8px;">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
